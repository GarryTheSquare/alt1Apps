<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Thieving Tables</title>
		<style>
			html, body { margin: 0; background: #1b1b1b; color: #ddd;
				font: 12px/1.45 system-ui, sans-serif; }
			a { color: #6cf; }
			h1 { font-size: 13px; font-weight: 600; margin: 0; color: #a7d9a0; }

			#bar { display: flex; align-items: center; gap: 6px;
				padding: 6px; background: #222; border-bottom: 1px solid #333;
				position: sticky; top: 0; z-index: 3; }
			#bar .spacer { flex: 1; }

			main { padding: 6px 6px 12px; }

			select, input { background: #2a2a2a; color: #ddd; font: inherit;
				border: 1px solid #3a3a3a; border-radius: 3px; padding: 2px 4px; min-width: 0; }
			input[type=checkbox] { accent-color: #5c9c54; width: 13px; height: 13px;
				margin: 0; vertical-align: -2px; }
			button { background: #2a2a2a; color: #ddd; border: 1px solid #3a3a3a;
				border-radius: 3px; padding: 2px 7px; font: inherit; cursor: pointer; }
			button:hover { background: #343434; }

			/* category tabs */
			#tabs { display: flex; gap: 3px; margin: 0 0 5px; }
			#tabs button { flex: 1; padding: 3px 0; color: #999; }
			#tabs button.sel { background: #2c3a2a; border-color: #4d6a48; color: #cfe8c9; }

			.controls { display: flex; align-items: center; gap: 5px; margin: 0 0 5px; }
			.controls .grow { flex: 1; }
			.controls label { color: #999; white-space: nowrap; }
			#level { width: 42px; text-align: right; }

			/* one thievable thing */
			.row { border: 1px solid #2b2b2b; border-radius: 3px; margin-bottom: 3px;
				background: #1f1f1f; }
			.row.open { border-color: #4d6a48; }
			.head { display: flex; align-items: baseline; gap: 6px; padding: 3px 5px;
				cursor: pointer; }
			.head:hover { background: #262626; }
			.head .nm { flex: 1 1 auto; min-width: 0; overflow: hidden;
				text-overflow: ellipsis; white-space: nowrap; }
			.head .lv { flex: 0 0 auto; font-variant-numeric: tabular-nums; color: #a7d9a0; }
			.head .xp { flex: 0 0 auto; font-variant-numeric: tabular-nums; color: #888;
				min-width: 46px; text-align: right; }
			/* expected xp from one click — the whole auto-pickpocket streak */
			.head .pc { flex: 0 0 auto; font-variant-numeric: tabular-nums; color: #c8a96a;
				min-width: 60px; text-align: right; }
			.row.locked .nm, .row.locked .lv, .row.locked .pc { color: #6b6b6b; }
			.tag { font-size: 10px; padding: 0 4px; border-radius: 6px; color: #bbb;
				background: #303030; border: 1px solid #3a3a3a; white-space: nowrap; }
			.tag.f2p { color: #9cc; }
			.body { padding: 2px 6px 7px; border-top: 1px solid #2b2b2b; }

			.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px 8px;
				margin: 3px 0 5px; }
			.facts div { display: flex; justify-content: space-between; gap: 6px; }
			.facts span:first-child { color: #999; flex: 0 0 auto; }
			.facts span:last-child { text-align: right; }

			table { width: 100%; border-collapse: collapse; margin: 2px 0 0; }
			th, td { text-align: left; padding: 1px 4px; border-bottom: 1px solid #2a2a2a;
				vertical-align: middle; }
			th { color: #888; font-weight: 500; }
			td.n, th.n { text-align: right; font-variant-numeric: tabular-nums;
				white-space: nowrap; }
			td.ic { width: 22px; padding: 0 2px 0 0; }
			td.ic img { display: block; max-width: 20px; max-height: 20px;
				image-rendering: pixelated; }

			.grp { color: #a7d9a0; margin: 7px 0 0; font-weight: 600; }
			.grp:first-child { margin-top: 3px; }
			.hint { color: #777; margin: 3px 0; }
			.empty { color: #777; font-style: italic; margin: 8px 4px; }
			#source { margin-top: 10px; border-top: 1px solid #2a2a2a; padding-top: 4px; }
			.count { color: #777; white-space: nowrap; }

			#addapp { padding: 4px 6px; background: #222; text-align: center; }
			#addapp:empty { display: none; }
		</style>
	</head>
	<body>
		<div id="bar">
			<h1>Thieving Tables</h1>
			<span class="spacer"></span>
			<span class="count" id="count"></span>
		</div>

		<main>
			<div id="tabs">
				<button data-tab="pickpocket">Pickpocket</button>
				<button data-tab="stall">Stalls</button>
				<button data-tab="chest">Chests</button>
			</div>

			<div class="controls">
				<input class="grow" type="search" id="search" placeholder="name, location or loot item" />
				<select id="sort">
					<option value="level">by level</option>
					<option value="name">by name</option>
					<option value="xp">by xp</option>
					<option value="click">by xp per click</option>
				</select>
			</div>

			<div class="controls">
				<label for="level">My level</label>
				<input type="number" id="level" min="1" max="120" step="1" value="99" />
				<label><input type="checkbox" id="onlyusable" /> hide what I can't do</label>
				<span class="spacer" style="flex:1"></span>
				<label><input type="checkbox" id="icons" checked /> icons</label>
			</div>

			<div class="controls" id="subrow">
				<label for="area">Area</label>
				<select id="area" class="grow"></select>
			</div>

			<div id="list"></div>
			<div class="hint" id="source"></div>
		</main>

		<div id="addapp"></div>
		<script src="./main.js"></script>
	</body>
</html>
