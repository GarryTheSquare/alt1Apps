<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Metronome</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<div id="bg"></div>
		<div id="head">
			<button id="run" title="Start / stop">▶</button>
			<span class="spacer"></span>
			<button id="gear" title="Settings">⚙</button>
		</div>

		<div id="stage"><div id="num">1</div><div id="bar"><i></i></div></div>

		<div id="settings" hidden>
			<div class="field">
				<label>Length</label>
				<input type="number" id="length" min="2" step="1" value="4" />
				<span class="unit" id="u-length">counts 1 → 4, then loops</span>
			</div>
			<div class="field">
				<label>Every</label>
				<input type="number" id="ticks" min="1" step="1" value="1" />
				<span class="unit" id="u-ticks">ticks</span>
			</div>
			<div class="field">
				<label>Colour</label>
				<input type="color" id="color" value="#ffffff" />
				<input type="text" class="hex" id="colorhex" value="#ffffff" spellcheck="false" />
			</div>
			<div class="field">
				<label>Reset</label>
				<button id="bind" class="bind" title="Press this key to restart the count at 1">click, then press a key</button>
				<button id="unbind" class="warn" title="Clear the reset key" hidden>✕</button>
			</div>
			<p class="note" id="keynote">Restarts the count at 1. Modifiers count, so
				<b>ctrl + z</b> and <b>z</b> are different keys. Only while this window has
				focus — Alt1 gives apps no global hotkeys.</p>
			<div class="actions">
				<button id="new" title="Open another metronome in its own window">+ metronome</button>
				<span class="spacer" style="flex:1"></span>
				<button id="del" class="warn" title="Delete this metronome and close its window" hidden>delete</button>
			</div>
			<div id="addapp"></div>
		</div>
		<script src="./main.js"></script>
	</body>
</html>
