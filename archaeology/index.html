<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Archaeology Tracker</title>
		<style>
			html, body { margin: 0; background: #1b1b1b; color: #ddd;
				font: 12px/1.45 system-ui, sans-serif; }
			a { color: #6cf; text-decoration: none; }
			a:hover { text-decoration: underline; }

			/* top bar: level, RSN, tabs */
			#bar { position: sticky; top: 0; z-index: 2;
				background: #222; border-bottom: 1px solid #333; padding: 5px 6px; }
			#lvlrow { display: flex; align-items: center; gap: 6px; }
			#lvlrow input { min-width: 0; background: #2a2a2a; color: #ddd; font: inherit;
				border: 1px solid #3a3a3a; border-radius: 3px; padding: 2px 5px; }
			#rsn { flex: 1; }
			#level { width: 42px; text-align: center; }
			#lvlrow label { flex: none; color: #888; }
			button { background: #2a2a2a; color: #ddd; border: 1px solid #3a3a3a;
				border-radius: 3px; padding: 2px 7px; font: inherit; cursor: pointer; }
			button:hover { background: #343434; }
			#lookup.busy { color: #777; }

			#tabs { display: flex; gap: 4px; margin-top: 5px; }
			#tabs button { flex: 1; padding: 3px 2px; }
			#tabs button.on { background: #2f4a35; border-color: #3d6045; }

			#status { padding: 2px 6px 0; color: #777; font-size: 11px; min-height: 14px; }
			#status.err { color: #e59; }

			#view { padding: 6px; }
			section { display: none; }
			section.on { display: block; }

			h3 { margin: 12px 0 5px; font-size: 12px; color: #cba; font-weight: 600; }
			h3:first-child { margin-top: 0; }
			p { margin: 5px 0; }
			ul { margin: 4px 0; padding-left: 18px; }

			table { border-collapse: collapse; width: 100%; margin: 5px 0; }
			th, td { border: 1px solid #333; padding: 2px 5px; text-align: left; vertical-align: top; }
			th { background: #262626; color: #cba; font-weight: 600; }
			tr:nth-child(even) td { background: #1f1f1f; }
			td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
			.wrap { overflow-x: auto; }

			.muted { color: #777; }
			.empty { padding: 14px; text-align: center; color: #666; }

			/* training steps */
			.step { border: 1px solid #333; border-radius: 3px; margin-bottom: 5px; background: #1e1e1e; }
			.step > summary { padding: 4px 6px; cursor: pointer; list-style: none; }
			.step > summary::-webkit-details-marker { display: none; }
			.step > summary::before { content: "▸ "; color: #666; }
			.step[open] > summary::before { content: "▾ "; }
			.step .body { padding: 0 8px 6px; }
			.step.here { border-color: #3d6045; }
			.step.here > summary { background: #2f4a35; }
			.step.done > summary { color: #777; }
			.range { font-weight: 600; }

			/* artefact rows */
			.filters { display: flex; gap: 4px; margin-bottom: 6px; }
			.filters input, .filters select { min-width: 0; background: #2a2a2a; color: #ddd;
				font: inherit; border: 1px solid #3a3a3a; border-radius: 3px; padding: 2px 5px; }
			.filters input { flex: 1; }

			.art { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-bottom: 1px solid #262626; }
			.art:hover { background: #232323; }
			.art .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
			.art .lvl { flex: none; width: 26px; text-align: right; color: #888;
				font-variant-numeric: tabular-nums; }
			.art .mats { flex: none; color: #777; font-size: 11px; }
			/* a use the wiki says doesn't consume the artefact, so it needs no extra copy */
			.star { color: #d8c268; cursor: help; font-weight: bold; padding: 0 2px; }
			/* one pip per copy of an artefact you need to keep */
			.pips { flex: none; display: flex; gap: 2px; }
			.pips button { padding: 0 3px; font-size: 13px; line-height: 16px; border-radius: 2px; }
			.pip.missing  { color: #9b6a6a; background: #2c2424; border-color: #3d3030; }
			.pip.damaged  { color: #d8c268; background: #4a442f; border-color: #605a3d; }
			.pip.restored { color: #8fdca0; background: #2f4a35; border-color: #3d6045; }
			/* spare damaged copies beyond the ones the pips track */
			.art .extra { flex: none; width: 34px; background: #2a2a2a; color: #777;
				font: inherit; border: 1px solid #3a3a3a; border-radius: 2px;
				padding: 1px 3px; text-align: center; }
			.art .extra.some { color: #d8c268; background: #4a442f; border-color: #605a3d; }

			/* owned-materials box on the Materials tab */
			.owned { width: 56px; background: #2a2a2a; color: #777; font: inherit;
				border: 1px solid #3a3a3a; border-radius: 2px; padding: 1px 3px;
				text-align: right; font-variant-numeric: tabular-nums; }
			.owned.some { color: #ddd; }
			.owned.short { border-color: #6a4040; }

			/* collections */
			.col { border: 1px solid #333; border-radius: 3px; margin-bottom: 5px; background: #1e1e1e; }
			.col.ready { border-color: #3d6045; }
			.col > summary { padding: 4px 6px; cursor: pointer; display: flex;
				align-items: center; gap: 6px; list-style: none; }
			.col > summary::-webkit-details-marker { display: none; }
			.col .cname { flex: 1; min-width: 0; overflow: hidden;
				text-overflow: ellipsis; white-space: nowrap; }
			.col .count { flex: none; color: #888; font-variant-numeric: tabular-nums; }
			.col.ready .count { color: #6c8; }
			.col .body { padding: 0 8px 6px; }
			.tick { flex: none; }
			.pill { flex: none; display: inline-block; width: 14px; text-align: center;
				border-radius: 2px; font-size: 12px; }
			.pill.restored { background: #2f4a35; color: #8fdca0; }
			.pill.damaged { background: #4a442f; color: #d8c268; }
			.pill.missing { background: #2c2424; color: #9b6a6a; }

			#addapp { padding: 4px 6px; background: #222; text-align: center; }
			#addapp:empty { display: none; }
			#src { padding: 8px 6px; color: #555; font-size: 10px; text-align: center; }
		</style>
	</head>
	<body>
		<div id="bar">
			<div id="lvlrow">
				<input type="text" id="rsn" placeholder="RuneScape name" />
				<button id="lookup" title="Look up your Archaeology level on RuneMetrics">Look up</button>
				<label for="level">Lvl</label>
				<input type="number" id="level" min="1" max="120" />
			</div>
			<div id="tabs">
				<button data-tab="training" class="on">Training</button>
				<button data-tab="artefacts">Artefacts</button>
				<button data-tab="materials">Materials</button>
				<button data-tab="collections">Collections</button>
				<button data-tab="gear">Gear</button>
			</div>
		</div>
		<div id="status"></div>

		<div id="view">
			<section id="training" class="on"></section>
			<section id="artefacts"></section>
			<section id="materials"></section>
			<section id="collections"></section>
			<section id="gear"></section>
		</div>

		<div id="addapp"></div>
		<div id="src">
			Data from the
			<a href="https://runescape.wiki/w/Archaeology_training" target="_blank">RuneScape Wiki</a>,
			CC BY-NC-SA 3.0.
		</div>
		<script src="./main.js"></script>
	</body>
</html>
